description = "Configure the local Agentic Inquiry storage environment (LanceDB)"
prompt = """
Configure the local Agentic Inquiry storage environment (LanceDB)

Usage: /ai:setup [local] [project-name]

# /ai:setup

Configure local Agentic Inquiry storage and create a new project.

## Quick Start

```bash
/ai:setup local myproject      # Local LanceDB
```

## Storage

Agentic Inquiry is local only. The one backend is LanceDB, created instantly with no external dependencies. If the user asks for anything else, explain that only local storage exists and that an external database for governed projects is future design work.

## What Gets Created

```
.agentic-inquiry/env-registry.json          # Environment registry
.agentic-inquiry/envs/<name>/config.yaml    # Storage configuration
.agentic-inquiry/envs/<name>/lancedb/       # Local vector store
```

## Environment Variables

The local default embeds with a local sentence-transformer model and needs no API key. Only set an embedding key if you explicitly switch to a hosted embedder:

```bash
OPENAI_API_KEY=sk-...           # Optional, hosted embedders only
```

## After Setup

```bash
ai index . --project-id <project-name>
ai search "main entry point" --project-id <project-name>
```

## Troubleshooting

- **Config not loading**: Check `INQUIRY_CONFIG` env var
- **Embedding errors**: The local model downloads on first use; check network access once

User Arguments: {{args}}

Based on the documentation above and the provided arguments, execute the appropriate `ai` CLI command(s) using the available tools.
"""
