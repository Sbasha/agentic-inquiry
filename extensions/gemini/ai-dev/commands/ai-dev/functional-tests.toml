description = "Run full UAT functional test suite - environment setup, indexing, and test execution"
prompt = """
Run full UAT functional test suite - environment setup, indexing, and test execution

Usage: /ai-dev:functional-tests [all|TEST_XX] [--env local|<name>] [--skip-index] [--batch N]

# /ai-dev:functional-tests

End-to-end functional test workflow. Handles environment selection, indexing, and orchestrated test execution.

## Workflow

```
Phase 1: Environment       → Check/create environment
Phase 2: Index              → Ensure codebase is indexed
Phase 3: Execute            → Run tests via subagent orchestration
Phase 4: Report             → Generate summary
```

## Phase 1: Environment Setup

### 1.1 Check existing environments

Read the environment registry:
```bash
cat .agentic-inquiry/env-registry.json 2>/dev/null || echo "No environments configured"
```

### 1.2 Ask user which environment to use

If `--env` was not specified, show available environments and ask:

| Option | Description |
|--------|-------------|
| **Existing env** | Use an already-configured environment from the registry |
| **Create local** | New LanceDB environment (instant, free) |

Use `AskUserQuestion` to let the user choose.

### 1.3 Environment validation

For the chosen environment:

1. **Read its config**: `cat .agentic-inquiry/envs/<name>/config.yaml`
2. **Test connectivity**:
   - Local/LanceDB: Check directory exists
3. **If creating new**: Follow `/ai:setup` workflow (local)

### 1.4 Set active environment

If not already active:
```bash
# Update env-registry.json active_environment field
```

## Phase 2: Indexing

### 2.1 Check index status

```bash
uv run --env-file .env ai index status
```

### 2.2 Index if needed

If no index exists or `--skip-index` was NOT passed:

```bash
uv run --env-file .env ai index .
```

Wait for completion and verify entity count > 0.

### 2.3 Skip if requested

If `--skip-index` was passed, verify existing index has content. If empty, warn and index anyway.

## Phase 3: Test Execution

### 3.1 Pre-execution checks

```bash
# Disk space (need >10GB free)
df -h .

# ai data size (should be <5GB)
du -sh .agentic-inquiry/ 2>/dev/null
```

### 3.2 Generate test run ID

```python
TEST_ID = datetime.now().strftime("%Y%m%d_%H%M%S")
BASE_PATH = f"test_results/ai/{TEST_ID}/"
```

### 3.3 Determine which tests to run

- `all` (default): All 15 tests
- `TEST_XX`: Specific test(s)
- `--batch N`: Only run batch N (1-5)

Available tests from `tests/01-agents/USE_CASES.md`:

| ID | Name | Batch | Complexity |
|----|------|-------|------------|
| 01 | Core Functionality (smoke) | 1 | Simple |
| 02 | Onboarding | 2 | Simple |
| 03 | Feature Implementation | 3 | Medium |
| 04 | Bug Investigation | 3 | Medium |
| 05 | Major Refactoring | 5 | Complex |
| 06 | Knowledge Building | 2 | Simple |
| 07 | Code Review | 3 | Medium |
| 08 | Documentation Generation | 4 | Medium |
| 09 | Dependency Analysis | 4 | Medium |
| 10 | Performance Investigation | 5 | Complex |
| 11 | API Design | 5 | Complex |
| 12 | Code Graph | 2 | Medium |
| 13 | Document Graph | 2 | Simple |
| 14 | Semantic Graph | 3 | Simple |
| 15 | Executive Function | 5 | Medium |

### 3.4 Execute using ai-dev:execute-tests pattern

Follow the `/ai-dev:execute-tests` skill for orchestration:

1. **Batch 1**: TEST_01 (smoke) - must pass before continuing
2. **Batch 2**: TEST_02, 06, 12, 13 - parallel (simple)
3. **Batch 3**: TEST_03, 04, 07, 14 - parallel (medium)
4. **Batch 4**: TEST_08, 09 - parallel (medium)
5. **Batch 5**: TEST_05, 10, 11, 15 - parallel (complex)

For each test, spawn a subagent (Task tool, `subagent_type: general-purpose`) following the `/ai-dev:ai-functional-tester` skill:

```
You are a functional tester. Follow the ai-dev:ai-functional-tester skill.

Execute this test:
- Test File: tests/01-agents/TEST_{XX}_{NAME}.md
- Test ID: {TEST_ID}
- Agent Name: ai
- Project ID: ai_test{XX}_{slug}_{TEST_ID}
- Output Path: {BASE_PATH}/{use_case_slug}/

Write full results to:
- {output_path}/TEST_LOG.md
- {output_path}/ISSUES_LOG.md
- {output_path}/FINAL_REPORT.md

After completing, return ONLY this JSON:
{
  "test_id": "...",
  "use_case": "...",
  "status": "pass|partial|fail",
  "pass_rate": "X/Y",
  "critical_issues": 0,
  "high_issues": 0,
  "adoption_score": 8,
  "one_line": "Brief summary"
}
```

### 3.5 Emergency stop conditions

**STOP all testing if:**
- Disk space drops below 5GB free
- Any test exceeds 60 minutes
- Two consecutive tests fail completely
- Smoke test (TEST_01) fails

## Phase 4: Report

### 4.1 Generate SUMMARY.md

After all tests complete, create `{BASE_PATH}/SUMMARY.md` with:
- Test run metadata (ID, environment, timestamp)
- Results table (status, pass rate, issues, adoption score per test)
- Overall adoption verdict
- Priority actions list

### 4.2 Spawn test-reviewer agent

Use the `test-reviewer` agent (in ai-dev) to analyze all FINAL_REPORT.md files and generate an executive summary.

### 4.3 Report location

```
test_results/ai/{TEST_ID}/
├── SUMMARY.md
├── EXECUTIVE_SUMMARY.md  (from test-reviewer)
├── test_01_core/
│   ├── TEST_LOG.md
│   ├── ISSUES_LOG.md
│   └── FINAL_REPORT.md
├── test_02_onboarding/
│   └── ...
└── ...
```

## Examples

```bash
# Run everything with environment selection
/ai-dev:functional-tests

# Run all tests using an existing named environment
/ai-dev:functional-tests all --env ai-test

# Run just the smoke test on local
/ai-dev:functional-tests TEST_01 --env local

# Run batch 2 (simple tests) skipping re-index
/ai-dev:functional-tests --batch 2 --skip-index

# Run specific tests
/ai-dev:functional-tests TEST_01 TEST_03 TEST_12
```

User Arguments: {{args}}

Based on the documentation above and the provided arguments, execute the appropriate `ai` CLI command(s) using the available tools.
"""
