description = "Unified test workflow - environment setup, test selection, execution, and cleanup"
prompt = """
Unified test workflow - environment setup, test selection, execution, and cleanup

Usage: /ai-dev:test [run|select|status|cleanup] [--env name] [--suite path]

# /ai:test

Unified testing workflow for Agentic Inquiry.

## Quick Start

```bash
/ai-dev:test                               # Interactive test workflow
/ai-dev:test run                           # Run all tests
/ai-dev:test run --suite tests/search/     # Run specific suite
/ai-dev:test --env test-env                # Use specific environment
```

## Workflow

The `/ai-dev:test` command handles the complete test lifecycle:

```
1. Environment Setup
   └── Creates isolated test environment (or uses existing)

2. Test Selection
   └── Choose tests: all, by path, by pattern

3. Execution
   └── Runs tests with functional-tester agent

4. Results & Cleanup
   └── Generate report, optionally destroy environment
```

## Subcommands

| Subcommand | Description |
|------------|-------------|
| `run` | Execute tests (default) |
| `select` | Interactive test selection |
| `status` | Show current test session status |
| `cleanup` | Clean up test artifacts and environments |

## Options

| Option | Description |
|--------|-------------|
| `--env` | Use specific environment |
| `--suite` | Path to test suite |
| `--keep-env` | Don't destroy environment after tests |
| `--parallel` | Run tests in parallel |

## Test Suites

**Unit Tests:**
```bash
/ai-dev:test run --suite tests/unit/
```

**Integration Tests:**
```bash
/ai-dev:test run --suite tests/integration/
```

**Agent Tests (UAT):**
```bash
/ai-dev:test run --suite tests/01-agents/
```

## Agents Used

- **functional-tester**: Executes tests, captures results
- **test-reviewer**: Generates executive summary

## Output

Test results written to:
```
test_results/ai/<timestamp>/
├── TEST_LOG.md         # Execution log
├── ISSUES_LOG.md       # Issues found
├── FINAL_REPORT.md     # Summary report
└── SESSION_SUMMARY.md  # Executive summary (from test-reviewer)
```

## Examples

```bash
# /ai:test
/ai-dev:test run

# /ai:test
/ai-dev:test run --suite tests/search/ --keep-env

# /ai:test
/ai-dev:test cleanup --age 7d
```

User Arguments: {{args}}

Based on the documentation above and the provided arguments, execute the appropriate `ai` CLI command(s) using the available tools.
"""
