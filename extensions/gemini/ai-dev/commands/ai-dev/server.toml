description = "Manage the Agentic Inquiry MCP server (start, stop, status, restart)"
prompt = """
Manage the Agentic Inquiry MCP server (start, stop, status, restart)

Usage: /ai-dev:server [start|stop|status|restart]

# /ai:server

Manage the Agentic Inquiry MCP server lifecycle.

## Commands

```bash
/ai-dev:server start     # Start server in background
/ai-dev:server stop      # Stop running server
/ai-dev:server status    # Check if server is running
/ai-dev:server restart   # Restart server
```

## Server Details

The MCP server provides:
- Semantic search tools
- Entity understanding
- Memory operations
- Pattern discovery

## Start Server

```bash
uv run --env-file .env ai serve &
```

Server runs on default port and registers with Claude Code automatically.

## Check Status

```bash
pgrep -f "ai serve" && echo "Running" || echo "Stopped"
```

## Environment

Requires:
- `OPENAI_API_KEY` for embeddings
- `INQUIRY_CONFIG` or default config at `config/default.yaml`
- `INQUIRY_PROJECT_ID` for project isolation

User Arguments: {{args}}

Based on the documentation above and the provided arguments, execute the appropriate `ai` CLI command(s) using the available tools.
"""
