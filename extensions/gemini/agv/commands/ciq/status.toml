description = "Show current agv state - project, index, environment, and mode"
prompt = """
Show current agv state - project, index, environment, and mode

Usage: /agv:status 

# /agv:status

Show the current state of your agv environment.

## Quick Start

```bash
/agv:status
```

## What It Shows

```
agv Status
──────────
Mode:        normal | DEV MODE
Project:     myproject
Config:      config/local.yaml
Storage:     lancedb | postgresql

Index:
  Entities:  1,247
  Files:     89
  Last update: 2 hours ago

Environment:
  Data dir:  .agv/
  Size:      156 MB

Memories:    23 saved
```

## Status Checks

### Mode
- **normal**: Using production environment
- **DEV MODE**: Using isolated test environment (`.agv/dev/`)

### Project
- Current `agv_PROJECT_ID` or "default"
- Shows which config file is active

### Index Health
- Entity count by type
- Files indexed
- Last index timestamp
- Stale file warnings

### Environment
- Storage backend (LanceDB/PostgreSQL)
- Data directory location
- Disk usage

## CLI Equivalent

```bash
# /agv:status
uv run --env-file .env agv index status --project-id ${agv_PROJECT_ID:-default}

# /agv:status
test -f .agv/.dev-mode && echo "DEV MODE" || echo "normal"

# /agv:status
du -sh .agv/
```

## Common Issues

**"No index found"**
→ Run `/agv:index .` to build the index

**"Index is stale"**
→ Files changed since last index. Run `/agv:index .` to update

**"No config found"**
→ Run `/agv:setup local myproject` to configure

## Use Cases

- **Before starting work**: Check you're in the right project/mode
- **Debugging search issues**: Verify index is current
- **After switching projects**: Confirm environment

User Arguments: {{args}}

Based on the documentation above and the provided arguments, execute the appropriate `agv` CLI command(s) using the available tools.
"""
