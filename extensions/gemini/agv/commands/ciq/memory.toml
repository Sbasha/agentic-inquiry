description = "Save and recall project memories and insights"
prompt = """
Save and recall project memories and insights

Usage: /agv:memory [save|recall|list] <text|query>

# /agv:memory

Persistent memory for project insights and learnings.

## Quick Start

```bash
/agv:memory save "Auth uses JWT with 24h expiry"    # Save insight
/agv:memory recall "authentication"                  # Find memories
/agv:memory list                                     # List all memories
```

## Subcommands

| Subcommand | Description |
|------------|-------------|
| `save` | Store a new memory |
| `recall` | Search memories by query |
| `list` | Show all saved memories |

## Saving Memories

Store insights, decisions, gotchas:
```bash
/agv:memory save "The SearchService requires warm-up on cold start"
/agv:memory save "Don't use pickle for entity serialization - security risk"
/agv:memory save "Config precedence: env vars > yaml > defaults"
```

## Recalling Memories

Semantic search across memories:
```bash
/agv:memory recall "startup performance"
# /agv:memory

/agv:memory recall "security"
# /agv:memory
```

## CLI Equivalent

```bash
uv run --env-file .env agv memory save "insight here" --project-id myproject
uv run --env-file .env agv memory recall "query" --project-id myproject
uv run --env-file .env agv memory list --project-id myproject
```

## Use Cases

1. **Knowledge capture**: Save learnings as you go
2. **Onboarding**: Build institutional knowledge
3. **Debugging**: Remember past solutions
4. **Decisions**: Document why things are the way they are

User Arguments: {{args}}

Based on the documentation above and the provided arguments, execute the appropriate `agv` CLI command(s) using the available tools.
"""
