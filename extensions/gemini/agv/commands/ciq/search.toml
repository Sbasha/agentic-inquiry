description = "Semantic search across code and documentation. Use when searching for code concepts, finding implementations, or exploring the codebase."
prompt = """
Semantic search across code and documentation. Use when searching for code concepts, finding implementations, or exploring the codebase.

Usage: /agv:search <query> [similar <entity>] [--type code|docs] [--limit n] [--json]

# /agv:search

Semantic search that understands code concepts, not just keywords.

## Quick Start

```bash
/agv:search "authentication flow"           # Search everything
/agv:search similar authenticate_user       # Find similar code
/agv:search "error handling" --type code    # Code only
/agv:search "API documentation" --type docs # Docs only
```

## Options

| Option | Description |
|--------|-------------|
| `query` | Natural language search query |
| `similar <entity>` | Find code similar to a specific entity |
| `--type` | Filter: `code`, `docs`, or all |
| `--limit` | Max results (default: 10) |
| `--json` | Output as JSON for scripting |
| `--project-id` | Target project |

## Search Types

### Semantic Search (default)
Finds conceptually similar code even with different terminology:
```bash
/agv:search "user login process"
# /agv:search
```

### Similar Code (powerful!)
Find code structurally/semantically similar to a known entity:
```bash
/agv:search similar authenticate_user
# /agv:search
```

Use this to:
- Find duplicate/similar implementations
- Discover related functions you didn't know about
- Identify refactoring candidates

### Code Search
Focus on code entities:
```bash
/agv:search "database connection pooling" --type code
```

### Documentation Search
Focus on docs and comments:
```bash
/agv:search "rate limiting configuration" --type docs
```

## CLI Equivalent

```bash
uv run --env-file .env agv search "authentication flow" --project-id myproject
uv run --env-file .env agv search similar authenticate_user --project-id myproject
```

## Output Formats

### Default (human-readable)
```
Results for "authentication flow":
1. auth/service.py:authenticate_user (0.92)
   Validates credentials and returns JWT token
2. api/middleware.py:require_auth (0.87)
   Decorator for protected endpoints
```

### JSON (`--json`)
```bash
/agv:search "authentication" --json
```
Returns structured data for scripting/piping.

## Tips

- Use natural language ("how does X work") not keywords
- Be specific about what you're looking for
- Use `similar` when you have a good example to match
- Combine with `/agv:entity` to dive deeper into results
- Add `--json` when piping to other tools

User Arguments: {{args}}

Based on the documentation above and the provided arguments, execute the appropriate `agv` CLI command(s) using the available tools.
"""
