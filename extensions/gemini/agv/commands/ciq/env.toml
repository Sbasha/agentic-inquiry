description = "Manage isolated agv environments for testing and development. Use when creating test environments, managing storage backends, or isolating work."
prompt = """
Manage isolated agv environments for testing and development. Use when creating test environments, managing storage backends, or isolating work.

Usage: /agv:env [create|list|destroy|status] [name] [--profile local|gcp]

# /agv:env

Manage isolated agv environments.

## Quick Start

```bash
/agv:env create dev --profile local     # Create local environment
/agv:env create staging --profile gcp   # Create GCP environment
/agv:env list                           # List all environments
/agv:env status dev                     # Check environment status
/agv:env destroy dev                    # Remove environment
```

## Profiles

| Profile | Storage | Setup | Cost |
|---------|---------|-------|------|
| `local` | LanceDB | Instant | Free |
| `gcp` | Cloud SQL PostgreSQL | 5-10 min | ~$0.50/hr |

## Environment Structure

Local environments create:
```
.agv/envs/<name>/
├── config.yaml     # Environment config
└── lancedb/        # Vector storage
```

## Use With Tests

Environments integrate with `/agv-dev:test`:
```bash
/agv:env create test-001 --profile local
/agv-dev:test --env test-001
```

## List Output

```
| Name      | Profile | Age    | Status | Cost Est |
|-----------|---------|--------|--------|----------|
| dev       | local   | 2h     | active | $0       |
| staging   | gcp     | 5h     | active | ~$2.50   |
| test-001  | local   | 30m    | active | $0       |
```

## Spawns `env-manager` Agent

For complex operations, this command spawns the `env-manager` agent which handles:
- GCP authentication
- Registry management
- Resource cleanup
- Cost tracking

User Arguments: {{args}}

Based on the documentation above and the provided arguments, execute the appropriate `agv` CLI command(s) using the available tools.
"""
