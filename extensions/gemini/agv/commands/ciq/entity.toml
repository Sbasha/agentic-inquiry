description = "Understand a code entity - its purpose, dependencies, and references"
prompt = """
Understand a code entity - its purpose, dependencies, and references

Usage: /agv:entity <name> [deps|refs]

# /agv:entity

Deep understanding of code entities: functions, classes, methods.

## Quick Start

```bash
/agv:entity authenticate_user        # Understand entity
/agv:entity User deps                # Show dependencies
/agv:entity User refs                # Show references
```

## Subcommands

| Subcommand | Description |
|------------|-------------|
| (none) | Full entity understanding |
| `deps` | What this entity depends on |
| `refs` | What references this entity |

## Entity Understanding

Get comprehensive info about any code entity:
```bash
/agv:entity SearchService
```

Returns:
- **Purpose**: What it does (from docstrings, comments, code)
- **Signature**: Parameters, return type
- **Location**: File and line number
- **Relationships**: Calls, called-by, inherits

## Dependencies

See what an entity depends on:
```bash
/agv:entity authenticate_user deps
```

Returns:
- Direct dependencies (imports, calls)
- Transitive dependencies (nested calls)
- External dependencies (libraries)

## References

Find where an entity is used:
```bash
/agv:entity User refs
```

Returns:
- Direct references (instantiation, calls)
- Inheritance (subclasses)
- Type hints (annotations)

## CLI Equivalent

```bash
uv run --env-file .env agv entity authenticate_user --project-id myproject
uv run --env-file .env agv entity deps authenticate_user --project-id myproject
uv run --env-file .env agv entity refs User --project-id myproject
```

## Use Cases

1. **Before refactoring**: Check refs to understand impact
2. **Learning codebase**: Understand what functions do
3. **Debugging**: Trace dependencies to find issues

User Arguments: {{args}}

Based on the documentation above and the provided arguments, execute the appropriate `agv` CLI command(s) using the available tools.
"""
