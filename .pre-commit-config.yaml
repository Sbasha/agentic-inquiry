# Pre-commit hooks for code quality and security
# Setup: uvx pre-commit install
# Run manually: uvx pre-commit run --all-files
# The detect-secrets hook needs a .secrets.baseline, which does not exist yet;
# until it does, installed hooks block every commit. Run single hooks with
# `uvx pre-commit run ruff-format --files <paths>` in the meantime.

repos:
  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: |
          (?x)^(
            \.secrets\.baseline|
            package-lock\.json|
            poetry\.lock|
            \.git/.*
          )$

  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # Prevent committing large files
      - id: check-added-large-files
        args: ['--maxkb=1000']

      # Check for files that would conflict in case-insensitive filesystems
      - id: check-case-conflict

      # Check for merge conflicts
      - id: check-merge-conflict

      # Check YAML syntax
      - id: check-yaml
        args: ['--unsafe']  # Allow custom YAML tags

      # Check JSON syntax
      - id: check-json

      # Check for valid Python syntax
      - id: check-ast

      # Prevent committing to main/master directly
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']

      # Detect private keys
      - id: detect-private-key

      # Trim trailing whitespace
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

      # Ensure files end with newline
      - id: end-of-file-fixer

      # Fix mixed line endings
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Python-specific hooks. Ruff runs through uv so the hooks use the version
  # pinned in uv.lock; a separate ruff-pre-commit rev drifts from it, and
  # formatter output changes between ruff releases.
  - repo: local
    hooks:
      # Run Ruff linter
      - id: ruff
        name: ruff
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        args: [--fix, --exit-non-zero-on-fix]

      # Run Ruff formatter
      - id: ruff-format
        name: ruff-format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

  # Type checking (optional - can be slow)
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.8.0
  #   hooks:
  #     - id: mypy
  #       additional_dependencies: [types-all]
  #       args: [--ignore-missing-imports]
