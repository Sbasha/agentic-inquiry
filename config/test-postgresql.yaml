# Agent-Vault Test Configuration - PostgreSQL Backend
# Uses GCP Cloud SQL for storage with full PostgreSQL configuration.
#
# Prerequisites:
# 1. Source environment file: source .agv/test/gcp-test-*.env
# 2. Start Cloud SQL Proxy: cloud-sql-proxy --port 5433 $GCP_CONNECTION_NAME &
# 3. Ensure Cloud SQL instance is running (use scripts/gcp/gcp-test-setup.sh)
#
# This config now uses the schema registry plugin system for backend-specific
# configuration fields (connection_string, pool_size, index_type, etc.)

# Storage configuration - PostgreSQL backend with named configuration
storage:
  root: "./.agv/test"
  default_project_id: "test"

  # Use PostgreSQL for vector and graph storage
  backend: "postgresql"
  event_store_backend: "postgresql"
  file_tracker_backend: "postgresql"

  # Named backend configurations (new plugin-based approach)
  # These configurations use the schema registry for validation
  backends:
    # PostgreSQL backend for testing - uses Cloud SQL Proxy on localhost:5433
    postgres_test:
      type: "postgresql"
      connection_string: "${DB_CONNECTION_STRING}"
      pool_size: 5
      max_overflow: 3
      table_prefix: "test_"
      index_type: "hnsw"
      index_params:
        m: 16
        ef_construction: 64
      fts_language: "english"

    # Cloud SQL backend (alternative configuration via IAM)
    cloudsql_test:
      type: "cloudsql"
      project: "${CLOUDSQL_PROJECT}"
      region: "${CLOUDSQL_REGION}"
      instance: "${CLOUDSQL_INSTANCE}"
      database: "${CLOUDSQL_DATABASE}"
      user: "${CLOUDSQL_USER}"
      pool_size: 5
      max_overflow: 3
      table_prefix: "test_"
      index_type: "hnsw"
      fts_language: "english"

  # Role assignments (point to named backends above)
  # These override the legacy backend fields
  vector_backend: "postgres_test"
  graph_backend: "postgres_test"
  events_backend: "postgres_test"
  file_tracker_backend_v2: "postgres_test"

  # NOTE: lancedb path removed - not used with PostgreSQL backend

  file_tracker:
    path: "file_tracker.db"

  document_cache:
    enabled: false
    path: "document_cache"

  event_store:
    path: "events.db"

  tables:
    document_chunks: "document_chunks"
    graph_entities: "graph_entities"
    graph_relationships: "graph_relationships"

  # NOTE: Legacy vector/graph sections removed - use backends: section above
  # PostgreSQL is configured via vector_backend and graph_backend roles

  relational:
    provider: "sqlite"
    sqlite:
      path: "./.agv/test/agent-vault.db"

  use_facade: true

# Maintenance configuration
maintenance:
  trigger: "project.closed"
  cleanup_retention_minutes: 60
  enabled: true

# Cache configuration (required)
cache:
  document_cache:
    max_size: 500
    ttl_seconds: 1800
    eviction_policy: "lru"

# Search configuration - smaller limits for testing
search:
  default_limit: 10
  max_limit: 50

  deduplication:
    enabled: true
    max_results_per_file: 1
    min_diversity_ratio: 0.7

  hybrid_search:
    vector_weight: 0.7
    fts_weight: 0.3
    rerank_by_graph: true
    reranker_type: "rrf"
    reranker_params:
      k: 60
    fallback_to_vector: true
    log_diagnostics: false
    overview_boost_factor: 1.5

  overview_boost:
    enabled: true
    auto_detect: true
    weights:
      readme: 0.35
      docs_directory: 0.25
      markdown: 0.15
      early_chunk: 0.15
      heading_title: 0.20
      code_penalty: -0.10
    overview_keywords:
      - "readme"
      - "overview"
      - "architecture"

  entity_matching:
    semantic_bridge_enabled: true
    thresholds:
      high: 0.5
      medium: 0.35
      low: 0.2
    weights:
      vector: 0.7
      name: 0.3
      semantic_bridge: 0.7

  graph_search:
    max_depth: 3
    relationship_types:
      - "calls"
      - "imports"
      - "contains"
      - "references"
    # PostgreSQL with pgvector is slower than LanceDB - increase timeouts
    timeouts:
      find_similar_small_ms: 5000    # LanceDB default: 500ms
      find_similar_medium_ms: 8000   # LanceDB default: 1000ms
      find_similar_large_ms: 15000   # LanceDB default: 2000ms
      understand_entity_ms: 15000    # Default: 5000ms
      analyze_impact_ms: 30000       # Default: 10000ms
      find_patterns_ms: 30000        # Default: 10000ms
      graph_traverse_ms: 15000       # Default: 5000ms

  query_sanitization:
    enabled: true
    escape_special_chars: true
    preserve_wildcards: false

  sparse_index:
    threshold: 50
    enable_fallback: true

# Embedding configuration
embeddings:
  default_provider: "sentence_transformer"
  default_dimensions: 384
  sentence_transformer:
    model_name: "all-MiniLM-L6-v2"
    ndims: 384
  hashing:
    ndims: 128

# Indexing configuration - faster for tests
indexing:
  timeouts:
    total: 120
    per_file: 2
    base: 30
  schema_mapping:
    enabled: true
    field_mappings: {}
  schema_validation:
    enabled: true
    strict_mode: false
    cache_schemas: true
    cache_ttl_seconds: 300
  impact_default_depth: 2
  impact_max_depth: 5
  impact_include_indirect: true
  processing_semaphore_limit: 5
  relationship_flush:
    batch_size: 100
    max_concurrent_batches: 5
    progress_log_interval: 500
    batch_commit_interval: 100
    auto_flush_threshold: 25000
    flush_timeout_seconds: 1800
    external_entity_flush_threshold: 5000
    enable_cache_prewarming: true
    enable_performance_monitoring: true
    slow_operation_threshold_ms: 500.0

# Parser configuration
parsers:
  unified_code:
    enabled: true
    priority: 100
    max_file_size: 10485760
    chunk_size: 1000
    chunk_overlap: 200
  salesforce_metadata:
    enabled: true
    priority: 75
  document:
    enabled: true
    priority: 50
  fallback_text:
    enabled: true
    priority: 0
    max_chunk_size: 1000
    chunk_overlap: 100

# Memory configuration
memory:
  context_manager:
    max_concurrent_contexts: 50
    cleanup_interval: 300
    context_ttl: 1800
  working_memory:
    capacity: 20
    eviction_policy: "lru"
  episodic_memory:
    capacity: 500
    table_name: "memory_episodic_medium"
  semantic_memory:
    capacity: 250
    table_name: "memory_semantic_high"
  consolidation:
    enabled: true
    interval_seconds: 300
    episodic_threshold: 0.8
    semantic_threshold: 0.9
  retrieval:
    default_strategy: "adaptive"
    cache_enabled: true
    cache_ttl_seconds: 300
    cache_size: 500
    ranking_weights:
      relevance: 0.5
      recency: 0.3
      importance: 0.2
  summary:
    auto_threshold: 150

# Event tracking
events:
  enabled: true
  queue_max_size: 500
  batch_size: 50
  flush_interval_seconds: 1.0
  retention_days: 7
  cleanup_interval_hours: 24
  sampling_enabled: false
  sampling_ratio: 10
  retry_max_attempts: 3
  retry_base_delay_seconds: 0.1
  drop_alert_threshold: 50

# Entity resolution
entity_resolution:
  case_insensitive: true
  fuzzy_matching:
    enabled: true
    threshold: 0.8
  cache_enabled: true
  cache_ttl_seconds: 1800

# Progress indicators
progress:
  enabled: true
  emit_interval: 10
  min_duration: 5

# Context building
context:
  token_budget:
    default_budget: 25000
    min_budget: 5000
    max_budget: 50000
    focus_allocations:
      code:
        code_weight: 0.7
        docs_weight: 0.3
      docs:
        code_weight: 0.3
        docs_weight: 0.7
      balanced:
        code_weight: 0.5
        docs_weight: 0.5

# Logging - reduced for tests
logging:
  directory: "logs"
  level: "INFO"
  max_bytes: 10485760
  backup_count: 3
  retention_hours: 24
  service_levels: {}
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"

# Connectors
connectors:
  default_connector: "filesystem"
  filesystem:
    enabled: true
    root: null
    ignore_patterns:
      - "*.pyc"
      - "__pycache__"
      - ".git"
      - ".venv"
      - "venv"
      - "node_modules"
    binary_extensions:
      - ".exe"
      - ".dll"
      - ".so"
      - ".bin"
      - ".zip"
      - ".png"
      - ".jpg"
    change_detection_enabled: true
    watch_enabled: false  # Disabled for tests
  remote_cache:
    enabled: false
    path: "connector_cache"
    max_size: 0
