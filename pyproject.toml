[build-system]
requires = ["hatchling>=1.21.1"]
build-backend = "hatchling.build"

[project]
name = "agentic-inquiry"
version = "0.2.0"
description = "Local cited evidence, scoped memory and codebase intelligence for coding agents."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Sammy Basha" }
]
dependencies = [
    "aiofiles>=23.0.0",
    "aiosqlite>=0.19.0",
    "chardet>=5.2.0",
    "dacite>=1.9.2",
    "fastapi>=0.104.0",
    "fastmcp>=0.1.0",
    "fsspec>=2024.1.0",
    "jsonschema>=4.0.0",
    "lancedb>=0.8.0",
    "mypy>=1.18.2",
    "onnxruntime>=1.16.0",
    "optimum>=1.16.0",
    "pandas>=2.0.0",
    "pdftext>=0.6.3",
    "pyyaml>=6.0.0",
    "ruff>=0.14.2",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=5.1.2",
    "slowapi>=0.1.9",
    "tantivy>=0.25.0",
    "tiktoken>=0.12.0",
    "tokenizers>=0.15.0",
    "transformers>=4.30.0",
    "tree-sitter-language-pack>=0.10.0",
    "unstructured[all-docs]>=0.18.15",
    "uvicorn>=0.24.0",
    "watchdog>=3.0.0",
    "unstructured[all-docs]>=0.18.18",
    "python-multipart>=0.0.22",
    "protobuf>=6.33.5",
    "pyasn1>=0.6.2",
    "filelock>=3.20.3",
    "fastembed>=0.7.4",
]

[project.scripts]
ai = "agentic_inquiry.cli.__main__:main"

[project.optional-dependencies]
test = [
    "pytest>=7.4",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["agentic_inquiry"]

# Ship the runtime config defaults inside the package namespace so a global
# install (`uv tool install .`) can resolve them via importlib.resources. The
# source tree keeps these files in the top-level config/ dir; this maps them
# into agentic_inquiry/config_defaults/ in the built wheel only.
[tool.hatch.build.targets.wheel.force-include]
"config/default.yaml" = "agentic_inquiry/config_defaults/default.yaml"
"config/config.schema.json" = "agentic_inquiry/config_defaults/config.schema.json"

[tool.hatch.build.targets.sdist]
include = ["agentic_inquiry", "tests", "README.md", "config"]

[dependency-groups]
dev = [
    "hypothesis>=6.0.0",
    "markdown>=3.10",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-benchmark>=5.1.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.2.0",
    "reportlab>=4.4.6",
    "types-jsonschema>=4.25.1.20251009",
    "types-protobuf>=6.32.1.20251210",
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.32.4.20260107",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 180
timeout_method = "thread"
testpaths = ["tests"]
# Markers registered via pytest_configure hook in tests/conftest.py

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
ignore_missing_imports = false
exclude = [
    "tests/parsers/samples/corrupted\\.py",
    "tests/parsers/samples/partial\\.py",
    "tests/parsers/samples/code/.*",
]

# Libraries without type stubs
[[tool.mypy.overrides]]
module = [
    "lancedb.*",
    "pyarrow.*",
    "pandas.*",
    "aiofiles.*",
    "asyncpg.*",
    "fsspec.*",
    "s3fs.*",
    "gcsfs.*",
    "sklearn.*",
    "tree_sitter_python",
    "tree_sitter_javascript",
    "tree_sitter_typescript",
    "tree_sitter_java",
    "tree_sitter_cpp",
    "tree_sitter_c",
    "tree_sitter_go",
    "tree_sitter_rust",
    "tree_sitter_ruby",
    "unstructured.*",
    "sentence_transformers.*",
    "tantivy.*",
    "tiktoken.*",
    "transformers.*",
    "watchdog.*",
    "tree_sitter.*",
    "onnxruntime.*",
    "tokenizers.*",
    "google.cloud.*",
    "optimum.*",
    "boto3",
    "botocore.*",
]
ignore_missing_imports = true

[tool.ruff]
# Extend exclude to include intentionally broken test files
extend-exclude = [
    "tests/parsers/samples/corrupted.py",
    "tests/parsers/samples/partial.py",
]

[tool.ruff.lint.per-file-ignores]
# E402: Module level import not at top of file (acceptable for sys.path manipulation)
"examples/**/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]
"scripts/**/*.py" = ["E402"]
